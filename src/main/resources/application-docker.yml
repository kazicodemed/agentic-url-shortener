spring:
  application:
    name: agentic-url-shortener

  # Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://postgres:5432/urlshortener
    driver-class-name: org.postgresql.Driver
    username: urlshortener
    password: urlshortener_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  data:
    redis:
      host: redis
      port: 6379
      password: redis_password
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour in milliseconds

server:
  port: 8080
  compression:
    enabled: true

# Application Configuration
url-shortener:
  base-url: ${URL_SHORTENER_BASE_URL:http://localhost:8080}
  short-code-length: 7
  cache:
    ttl: 3600
  rate-limit:
    enabled: false
    requests-per-hour: 100

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.schwab: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
